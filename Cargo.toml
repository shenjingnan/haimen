[workspace]
members = [
    "crates/haimen-core",
    "crates/haimen-dingtalk",
    "crates/haimen-lark",
    "crates/haimen-xiaozhi",
    ".",    # 根目录的主 crate
]

[package]
name = "haimen"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "AI 网关基建 CLI"
license = "MIT"
repository = "https://github.com/shenjingnan/haimen"
include = [
    "/src/**/*",
    "/crates/**/*",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE*",
    "/README.md",
    "/web-ui/dist/**/*",
]

[workspace.dependencies]
# CLI 框架
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# 错误处理
thiserror = "2"
anyhow = "1"

# Web 框架
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# 静态资源嵌入
rust-embed = "8"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# HTTP 客户端
reqwest = { version = "0.13", features = ["json", "stream"] }

# 异步流处理
futures-util = "0.3"
async-trait = "0.1"

# MCP 协议
rmcp = { version = "2.2.0", features = ["client", "transport-child-process"] }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"

tokio-util = "0.7"
tokio-stream = "0.1"
tempfile = "3"

# 自动打开浏览器
webbrowser = "1.0"

# UUID
uuid = { version = "1", features = ["v4"] }

# Opus 音频编码
opus2 = { version = "0.4", features = ["bundled"] }


[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
rust-embed = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
rmcp = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }

# Workspace crate 依赖
haimen-core = { path = "crates/haimen-core", version = "0.1.0" }
haimen-dingtalk = { path = "crates/haimen-dingtalk", version = "0.1.0" }
haimen-lark = { path = "crates/haimen-lark", version = "0.1.0" }
haimen-xiaozhi = { path = "crates/haimen-xiaozhi", version = "0.1.2" }
univoice = { version = "0.1.0", features = ["opus-encoder"] }
opus2 = { workspace = true }
webbrowser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[profile.dist]
inherits = "release"
lto = "thin"
