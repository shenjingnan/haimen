[package]
name = "haimen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AI 网关基建 CLI"
license = "MIT"
repository = "https://github.com/shenjingnan/haimen"

[dependencies]
# CLI 框架
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# 错误处理
thiserror = "2"
anyhow = "1"

# Web 框架
axum = "0.8"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# 静态资源嵌入
rust-embed = "8"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# HTTP 客户端（upgrade 命令使用）
reqwest = { version = "0.13", features = ["json", "stream"] }
# URL 解析
# url = "2"
futures-util = "0.3"                                   # 异步流处理
async-trait = "0.1"                                    # async fn in traits
rmcp = { version = "1.7.0", features = ["client", "transport-child-process"] }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
dingtalk-stream = "0.1.7"
tokio-util = "0.7"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"
