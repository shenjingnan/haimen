[target.x86_64-pc-windows-msvc]
# 启用静态 CRT 链接，与 libopus_sys (opus2/univoice) 的 CMake 构建保持一致
# 避免 __imp_floor 等符号在 MSVC 链接时未解析（LNK2001）
# 同时生成自包含的二进制文件，无需 VC++ 运行时分发
rustflags = ["-C", "target-feature=+crt-static"]

# libopus_sys 通过 cmake crate 编译 Opus 时默认使用 /MD（动态 CRT），
# 与 Rust 的 +crt-static（静态 CRT）不匹配，导致 __imp_floor 等数学符号未解析。
# 显式通知 CMake 使用 MultiThreaded（/MT）使 Opus 也使用静态 CRT，保持一致。
[env]
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
