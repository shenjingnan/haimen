name: Copy Installers for User-Friendly URLs

on:
  release:
    types: [published]

jobs:
  copy-installers:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Copy haimen-installer.sh -> install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Downloading installers from release ${TAG}..."
          gh release download "$TAG" --pattern "haimen-installer.sh"
          gh release download "$TAG" --pattern "haimen-installer.ps1"
          mv haimen-installer.sh install.sh
          mv haimen-installer.ps1 install.ps1
          gh release upload "$TAG" install.sh install.ps1 --clobber
