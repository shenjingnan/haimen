[package]
name = "haimen-xiaozhi"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
description = "小智硬件设备 WebSocket 音频协议连接器"
license = "MIT"
repository = "https://github.com/shenjingnan/haimen"

[dependencies]
axum = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio-tungstenite = "0.30"
