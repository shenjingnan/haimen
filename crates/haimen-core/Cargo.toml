[package]
name = "haimen-core"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "AI 网关共享抽象层 - Message 消息模型、MessageChannel 消息通道与 AgentProvider Agent 契约 trait"
license = "MIT"
repository = "https://github.com/shenjingnan/haimen"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

# 仅 Windows：解析 npm 安装的 CLI shim（.cmd/.bat）
[target.'cfg(windows)'.dependencies]
which = { workspace = true }
